<!-- A deploy cannot reach a tab that is never reloaded. The banner appears
     only when the server reports a build different from the one this tab
     loaded with; reloading stays the user's choice so a half-filled form is
     never thrown away. -->
<div class="new-version-bar" *ngIf="appVersion.newVersionAvailable">
  <mat-icon>system_update_alt</mat-icon>
  <span>גרסה חדשה של המערכת זמינה</span>
  <button type="button" (click)="appVersion.reload()">רענן עכשיו</button>
</div>

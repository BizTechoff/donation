<div class="donation-form-step">
  <!-- Donor Card -->
  <div class="donor-card">
    <mat-icon class="donor-icon">person</mat-icon>
    <div class="donor-info">
      <div class="donor-name">{{ getDonorFullName() }}</div>
    </div>
  </div>

  <!-- Amount -->
  <div class="form-group">
    <label class="form-label">סכום *</label>
    <div class="amount-row">
      <input
        #amountInput
        type="text"
        inputmode="decimal"
        class="amount-input"
        placeholder="0"
        [(ngModel)]="amount">
      <!-- מטבע - רשימה נפתחת אחת (הכפתורים בטור יצאו מחוץ למסך בטלפון) -->
      <select class="form-select currency-select" [(ngModel)]="currencyId">
        @for (cur of currencyList; track cur.id) {
          <option [value]="cur.id">{{ cur.symbol }} {{ cur.id }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Payment Method -->
  <div class="form-group">
    <label class="form-label">אמצעי תשלום *</label>
    <div class="method-chips">
      @for (method of donationMethods; track method.id) {
        <button
          class="method-chip"
          [class.active]="selectedMethodId === method.id"
          (click)="selectedMethodId = method.id">
          <mat-icon>{{ getMethodIcon(method) }}</mat-icon>
          <span>{{ method.name }}</span>
        </button>
      }
    </div>
  </div>

  <!-- שדות אמצעי התשלום - אותו כלל של המחשב (shared/utils/donation-method-fields) -->
  @if (fields.checkNumber) {
    <div class="form-group">
      <label class="form-label">מספר צ'ק</label>
      <input type="text" inputmode="numeric" class="form-input" placeholder="מספר צ'ק" [(ngModel)]="checkNumber">
    </div>
  }
  @if (fields.bank) {
    <div class="form-group">
      <label class="form-label">בנק</label>
      <select class="form-select" [(ngModel)]="bankId">
        <option value="">בחר בנק</option>
        @for (bank of banks; track bank.id) {
          <option [value]="bank.id">{{ bank.name }}</option>
        }
      </select>
    </div>
  }
  @if (fields.organization) {
    <div class="form-group">
      <label class="form-label">עמותה</label>
      <select class="form-select" [(ngModel)]="organizationId">
        <option value="">בחר עמותה</option>
        @for (org of organizations; track org.id) {
          <option [value]="org.id">{{ org.name }}</option>
        }
      </select>
    </div>
  }
  @if (fields.accountNumber) {
    <div class="form-group">
      <label class="form-label">מספר חשבון</label>
      <input type="text" inputmode="numeric" class="form-input" placeholder="מספר חשבון" [(ngModel)]="accountNumber">
    </div>
  }
  @if (fields.voucherNumber) {
    <div class="form-group">
      <label class="form-label">מספר שובר</label>
      <input type="text" inputmode="numeric" class="form-input" placeholder="מספר שובר" [(ngModel)]="voucherNumber">
    </div>
  }

  <!-- Campaign -->
  <div class="form-group">
    <label class="form-label">קמפיין</label>
    <select class="form-select" [(ngModel)]="campaignId">
      <option value="">ללא קמפיין</option>
      @for (campaign of campaigns; track campaign.id) {
        <option [value]="campaign.id">{{ campaign.name }}</option>
      }
    </select>
  </div>

  <!-- More Details (collapsed) -->
  <button class="toggle-more" (click)="showMore = !showMore">
    <mat-icon>{{ showMore ? 'expand_less' : 'expand_more' }}</mat-icon>
    <span>פרטים נוספים</span>
  </button>

  @if (showMore) {
    <div class="more-fields">
      <div class="form-group">
        <label class="form-label">סוג תרומה</label>
        <div class="method-chips">
          <button class="method-chip" [class.active]="donationType === 'full'" (click)="donationType = 'full'">
            <span>רגילה</span>
          </button>
          <button class="method-chip" [class.active]="donationType === 'commitment'" (click)="donationType = 'commitment'">
            <span>התחייבות</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">סיבה</label>
        <input type="text" class="form-input" placeholder="סיבת התרומה" [(ngModel)]="reason">
      </div>

      <div class="form-group">
        <label class="form-label">הערות</label>
        <textarea class="form-textarea" placeholder="הערות נוספות" [(ngModel)]="notes" rows="2"></textarea>
      </div>
    </div>
  }

  @if (errorMessage) {
    <div class="error-message">{{ errorMessage }}</div>
  }

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="btn-secondary" (click)="back.emit()">
      <mat-icon>arrow_forward</mat-icon>
      חזור
    </button>
    <button class="btn-primary" [disabled]="!canSave || saving" (click)="save()">
      @if (saving) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        שמור
      }
    </button>
  </div>
</div>

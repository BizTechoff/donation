<!-- Family Relation Details Modal -->
<div class="family-relation-modal">

  <div class="modal-header">
    <div class="header-content">
      <div class="header-icon">
        <mat-icon>family_restroom</mat-icon>
      </div>
      <div class="header-text">
        <h2>{{ isNewRelation ? 'הוספת קשר משפחתי' : 'עריכת קשר משפחתי' }}</h2>
      </div>
    </div>
    <button class="modal-close" (click)="closeModal()" matTooltip="סגור" [dir]="i18n.lang.RTL ? 'rtl' : 'ltr'">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">

    <!-- Relationship Type Selection as Cards -->
    <div class="relationship-type-selection">
      <label class="relationship-selection-label">{{ (i18n.terms$ | async)?.selectRelationshipLabel || 'בחר סוג קשר:' }}</label>
      <div class="relationship-types-grid">
        <!-- סעיף 8 - הרשימה נבנית מ-RELATIONSHIP_TYPES, מקור אחד עם טבלת
             ההיפוך. קודם היו כאן 15 בלוקים זהים שנכתבו ביד, ולכן הרשימה
             והמפה נפרדו: "אבא" נבחר ולא היה לו היפוך, וגיס / אחיין / חתן /
             כלה / בעל / אישה היו במפה ולא ניתנים לבחירה. -->
        <div class="relationship-type-option" *ngFor="let type of relationshipTypes"
             [class.active]="newRelationshipType === type.value">
          <label class="relationship-card">
            <input type="radio" name="relationshipType" [value]="type.value" [(ngModel)]="newRelationshipType" class="relationship-radio">
            <div class="relationship-content">
              <span class="relationship-label">{{ type.label }}</span>
            </div>
          </label>
        </div>
          </label>
        </div>
      </div>
    </div>

    <!-- Donor Selection -->
    <div class="donor-selection" *ngIf="newRelationshipType">
      <label class="donor-selection-label">{{ (i18n.terms$ | async)?.selectDonorLabel || 'בחר תורם:' }}</label>
      <div class="donor-search-field">
        <input type="text" class="form-control donor-select"
               [value]="selectedDonor?.fullName || ''"
               [placeholder]="(i18n.terms$ | async)?.selectDonorPlaceholder || 'בחר תורם'"
               readonly
               (click)="openDonorSelectionModal()">
        <button mat-icon-button (click)="openDonorSelectionModal()" [title]="'חפש תורם'">
          <mat-icon>search</mat-icon>
        </button>
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <div class="footer-actions">
      <button mat-stroked-button (click)="closeModal()" class="cancel-button">
        <mat-icon>close</mat-icon>
        ביטול
      </button>
      <button mat-raised-button color="primary" (click)="saveRelation()" class="save-button"
              [disabled]="!newRelationshipType || !selectedDonorId">
        <mat-icon>save</mat-icon>
        שמירה
      </button>
    </div>
  </div>

</div>
